site_name: ProcessJR Operational Intelligence Platform
site_description: AI-Powered Operational Knowledge, Workforce Assistance, and Operational Intelligence Platform
site_url: https://docs.processjr.ai
repo_name: processjr
site_author: ProcessJR Team

theme:
  name: material
  language: en
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs          # Tab-based main navigation
    - navigation.sections      # Group navigation elements into sections
    - navigation.instant       # Single Page App-like instant loading
    - navigation.tracking      # Update URL hash on scroll
    - navigation.top           # "Back to top" button
    - search.suggest           # Query completion suggestion
    - search.highlight         # Highlight matching text
    - search.share             # Share queries via URL
    - content.code.copy        # Add copy button to code blocks

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Platform: index.md
  - Features Catalog: features.md
  - Technical Architecture: architecture.md
  - Operational Workflows: workflows.md
  - Naming & Branding: branding.md
